<!-- Compact 7-day weather strip for destination cards -->
<div data-trek-weather-card
     data-dest-id="{{ dest.id }}"
     class="px-5 pb-2">
    <div data-weather-card-loading class="border-t border-gray-50 pt-3 flex items-center gap-2">
        <span class="inline-block w-3 h-3 border-2 border-brandGreen/20 border-t-brandGreen rounded-full animate-spin"></span>
        <span class="text-[10px] text-gray-400">Loading climate…</span>
    </div>
    <div data-weather-card-body class="hidden"></div>
</div>
