{% extends "base.html" %}

{% block title %}Ghumna Jam - Login{% endblock %}

{% block auth_content %}
<div class="tabs" aria-label="Authentication tabs">
    <a class="active" href="{{ url_for('auth.login') }}">Log In</a>
    <a href="{{ url_for('auth.signup') }}">Sign Up</a>
</div>

<h1>Welcome Back</h1>

<p class="subtitle">
    Please enter your credentials to access your
    adventure registry.
</p>

<form method="post" action="{{ url_for('auth.login') }}" style="display:contents;">
    <label class="field">
        Email Address

        <div class="input">
            <span aria-hidden="true">&#9993;</span>
            <input type="email"
                   name="email"
                   placeholder="explorer@alpine.com"
                   autocomplete="email"
                   required>
        </div>
    </label>

    <label class="field">
        Password

        <div class="input">
            <span aria-hidden="true">&#128274;</span>
            <input type="password"
                   name="password"
                   placeholder="........"
                   autocomplete="current-password"
                   required>
        </div>
    </label>

    <div class="row">
        <label style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" name="remember">
            Remember me
        </label>

        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </div>

    <button class="btn" type="submit">Log In</button>
</form>

<div class="divider">
    <span></span>
    OR CONTINUE WITH
    <span></span>
</div>

<div class="socials">
    <button class="social-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google
    </button>

    <button class="social-btn" type="button">
        <span aria-hidden="true">&#127822;</span>
        Apple
    </button>
</div>
{% endblock %}
