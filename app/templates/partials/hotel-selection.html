{% if hotel_options %}
<div class="space-y-3">
    <div class="flex items-center justify-between gap-3">
        <label class="block text-[10px] uppercase font-bold tracking-wider text-gray-400">
            Select Hotel
        </label>
        <span class="text-[10px] font-bold text-brandGreen bg-brandGreen/10 px-2 py-1 rounded-full">
            Optional Stay
        </span>
    </div>

    <div class="grid gap-3">
        {% for hotel in hotel_options %}
            <label class="group cursor-pointer block">
                <input type="radio"
                       name="selected_hotel"
                       value="{{ hotel.name }}"
                       data-price="{{ hotel.price_per_night }}"
                       class="peer sr-only"
                       {% if loop.first %}checked{% endif %}>
                <span class="block rounded-xl border border-gray-200 bg-gray-50 p-4 transition peer-checked:border-brandGreen peer-checked:bg-brandGreen/5 peer-checked:shadow-sm group-hover:border-brandGreen/30">
                    <span class="flex items-start justify-between gap-3">
                        <span>
                            <span class="block text-sm font-bold text-brandGreen">{{ hotel.name }}</span>
                            <span class="block text-[11px] text-gray-500 mt-0.5">{{ hotel.location }} · {{ hotel.style }}</span>
                        </span>
                        <span class="text-right shrink-0">
                            <span class="block text-xs font-bold text-brandGreen">Rs. {{ "{:,.0f}".format(hotel.price_per_night) }}</span>
                            <span class="block text-[9px] uppercase tracking-wider text-gray-400">/ night</span>
                        </span>
                    </span>
                    <span class="block text-[11px] text-gray-500 mt-2 leading-relaxed">
                        {{ hotel.perk }}
                    </span>
                </span>
            </label>
        {% endfor %}
    </div>
</div>
{% endif %}
