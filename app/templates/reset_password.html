{% extends "base.html" %}

{% block title %}Ghumna Jam - Reset Password{% endblock %}

{% block auth_content %}
<div class="tabs" aria-label="Authentication tabs">
    <a class="active" href="#">Reset Password</a>
    <a href="{{ url_for('auth.login') }}">Back to Login</a>
</div>

<h1>Create New Password</h1>

<p class="subtitle">
    Please enter your new password below. Make sure it's strong and secure!
</p>

<form method="post" action="{{ url_for('auth.reset_password') }}" style="display:contents;">
    <label class="field">
        New Password
        <div class="input">
            <span aria-hidden="true">&#128274;</span>
            <input type="password"
                   name="password"
                   placeholder="........"
                   autocomplete="new-password"
                   required>
        </div>
    </label>

    <label class="field">
        Confirm New Password
        <div class="input">
            <span aria-hidden="true">&#128274;</span>
            <input type="password"
                   name="confirm_password"
                   placeholder="........"
                   autocomplete="new-password"
                   required>
        </div>
    </label>

    <button class="btn" type="submit">Reset Password</button>
</form>
{% endblock %}
