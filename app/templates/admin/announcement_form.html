{% extends "admin/base.html" %}
{% block title %}Edit Announcement{% endblock %}
{% block header %}Edit Announcement{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="mb-5">
    <a href="{{ url_for('admin.announcements') }}" class="text-sm text-slate-500 hover:text-slate-700">← Back to Announcements</a>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <form method="POST" action="{{ url_for('admin.announcement_update', ann_id=ann.id) }}" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Title <span class="text-red-500">*</span></label>
        <input type="text" name="title" required value="{{ ann.title }}"
               class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Message <span class="text-red-500">*</span></label>
        <textarea name="message" rows="5" required
                  class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 resize-none">{{ ann.message }}</textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Type</label>
        <select name="type" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
          {% for val, label in [("info","ℹ Info"),("warning","⚠ Warning"),("success","✓ Success"),("danger","✕ Danger")] %}
          <option value="{{ val }}" {% if ann.type == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" name="is_active" value="1" {% if ann.is_active %}checked{% endif %}
               class="w-4 h-4 rounded border-slate-300 text-yellow-400 focus:ring-yellow-400" />
        <span class="text-sm text-slate-600">Published (visible on site)</span>
      </label>

      <div class="flex gap-3 pt-2">
        <button type="submit"
                class="px-6 py-2.5 bg-[#1f2a27] text-white font-semibold rounded-lg text-sm hover:bg-[#2d3d38] transition-colors">
          Save Changes
        </button>
        <a href="{{ url_for('admin.announcements') }}"
           class="px-6 py-2.5 border border-slate-200 text-slate-600 font-medium rounded-lg text-sm hover:bg-slate-50 transition-colors">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
